[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funcprops"
version = "0.1.0"
description = "Symbolic global function properties backed by SymPy"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{name = "Bhuvanesh Bhatt", email = "bhuvaneshbhatt@gmail.com"}]
dependencies = [
  "sympy>=1.14",
  "mpmath>=1.3",
  "semialg>=1.0.0",
]
keywords = [
    "sympy",
    "symbolic mathematics",
    "symbolic computation",
    "function analysis",
    "function properties",
    "real analysis",
    "complex analysis",
    "domains",
    "ranges",
    "zeros",
    "root isolation",
    "monotonicity",
    "convexity",
    "continuity",
    "differentiability",
    "smoothness",
    "singularities",
    "branch cuts",
    "injectivity",
    "surjectivity",
    "bijectivity",
    "sign analysis",
    "semialgebraic",
    "certified computation",
    "exact computation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]


[project.urls]
Homepage = "https://github.com/BhuvaneshBhatt/funcprops"
Documentation = "https://github.com/BhuvaneshBhatt/funcprops#readme"
Repository = "https://github.com/BhuvaneshBhatt/funcprops"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
funcprops = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: numerical seam-validation tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE001", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/funcprops/__init__.py" = ["F401", "F403"]
"src/funcprops/real_analysis/__init__.py" = ["F401"]
