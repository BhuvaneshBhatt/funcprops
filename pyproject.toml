[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funcprops"
version = "0.3.0"
description = "Symbolic analysis of real, complex, and multivariate function properties for SymPy"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "Bhuvanesh Bhatt", email = "bhuvaneshbhatt@gmail.com"}]
dependencies = [
  "sympy>=1.14",
  "mpmath>=1.3",
  "semialg>=1.3.0",
  "exprtools>=0.1.0",
]
keywords = [
  "sympy",
  "symbolic mathematics",
  "symbolic computation",
  "function analysis",
  "function properties",
  "real analysis",
  "complex analysis",
  "domains",
  "ranges",
  "zeros",
  "root isolation",
  "monotonicity",
  "convexity",
  "smoothness",
  "singularities",
  "branch cuts",
  "mapping properties",
  "sign analysis",
  "semialgebraic",
  "certified computation",
  "exact computation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]


[project.urls]
Homepage = "https://github.com/BhuvaneshBhatt/funcprops"
Documentation = "https://github.com/BhuvaneshBhatt/funcprops#readme"
Repository = "https://github.com/BhuvaneshBhatt/funcprops"
Issues = "https://github.com/BhuvaneshBhatt/funcprops/issues"
Changelog = "https://github.com/BhuvaneshBhatt/funcprops/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
funcprops = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: numerical seam-validation tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE001", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/funcprops/__init__.py" = ["F401", "F403"]
"src/funcprops/real_analysis/__init__.py" = ["F401"]
